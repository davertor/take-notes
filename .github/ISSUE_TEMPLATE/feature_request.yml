name: Feature request
description: Suggest a source, an export, or a change to how notes are written
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the solution — it often has a cheaper answer than the one you had in mind.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A new source type
        - A new export format
        - How the notes are written
        - The gallery
        - The note design
        - Install / packaging
        - Other
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints
      description: See CONTRIBUTING.md. These are not gates on your idea — just useful to know upfront.
      options:
        - label: This can be done without adding a third-party dependency
        - label: I would be up for implementing it
